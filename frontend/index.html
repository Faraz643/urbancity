  <body>
    <div id="root"></div>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script>
      (function () {
        var realCashfree = window.Cashfree;
        window.Cashfree = function (options) {
          var real =
            typeof realCashfree === "function" ? realCashfree(options) : null;
          return {
            checkout: function (args) {
              var session = String((args && args.paymentSessionId) || "");
              if (session.indexOf("DODO_URL:") === 0) {
                var encoded = session
                  .slice(9)
                  .replace(/-/g, "+")
                  .replace(/_/g, "/");
                while (encoded.length % 4) encoded += "=";
                try {
                  window.location.href = atob(encoded);
                  return Promise.resolve();
                } catch (e) {
                  throw new Error("Invalid Dodo checkout URL.");
                }
              }
              if (!real || typeof real.checkout !== "function")
                throw new Error("Cashfree checkout is unavailable.");
              return real.checkout(args);
            },
          };
        };
      })();
    </script>
    <script>
      // Dodo appends payment_id/status to the return URL. The existing React verifier
      // expects order_id, so normalize the URL before the React app mounts.
      (function () {
        var p = new URLSearchParams(window.location.search);
        var paymentId = p.get("payment_id");
        if (paymentId && !p.get("order_id")) {
          p.set("order_id", paymentId);
          history.replaceState(
            {},
            "",
            window.location.pathname +
              "?" +
              p.toString() +
              window.location.hash,
          );
        }
      })();
    </script>
    <script src="/board-owner-ui.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
